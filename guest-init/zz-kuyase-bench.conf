<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Emulator bench only.

       The Midi (cucumber) and Station 3 (orion) profiles run the legacy
       renderer: it has no private bus of its own, so shairport registers
       org.gnome.ShairportSync on the system bus. The stock firmware policy
       ends with <deny own="*"/> and <deny send_type="method_call"/>, so the
       name can never be acquired and voice/sender transport has no
       destination. Allow the root-owned bench processes to own names and
       send calls; nothing else in this image needs the system bus. -->
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow send_type="method_call"/>
    <allow send_type="signal"/>
  </policy>
</busconfig>
